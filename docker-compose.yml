services:

  # ─── Press (FFmpeg transcode service) ───────────────────────────────────────
  jellyjar-press:
    build:
      context: ./press
      dockerfile: Dockerfile
    container_name: jellyjar-press
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      MEDIA_ROOT: /mnt
      OUTPUT_ROOT: /output
      CONFIG_ROOT: /config
      LIBVA_DRIVER_NAME: iHD     # use Intel iHD driver for QSV/VAAPI on gen8+ iGPUs; remove on AMD
      # ENCODER: h264_vaapi     # pin encoder; skips startup probe (h264_nvenc | h264_qsv | h264_vaapi | libx264)
      # HW_DECODE: 0            # NVENC/VAAPI: decode + scale on the CPU instead of the GPU (default 1)
      # AUDIO_LANGUAGES: en      # audio tracks to keep besides the default one (e.g. en,ja — 2- or 3-letter codes); unset keeps all
      MAX_WORKERS: 1             # concurrent transcode jobs; most HW encoders only support one session at a time
      # PRESS_ROLE: coordinator  # for a multi-host setup (see docker-compose.worker.yml); also lets MAX_WORKERS be 0. Default: standalone
      CLEANUP_AFTER_DAYS: 0      # auto-delete completed jobs + their output after N days; 0 disables cleanup
    volumes:
      - /mnt/Media/Movies:/mnt/movies:ro
      - /mnt/Media/TV Shows:/mnt/tv:ro
      - jellyjar-output:/output
      - jellyjar-config:/config
    # Intel / AMD GPU (VAAPI & QSV) — exposes /dev/dri/renderD128 inside container.
    # This compose file is a reference example, not what actually runs the service — hosts
    # without a /dev/dri device will fail to start the container with this mapping present.
    # Comment it out (or move it to an override file) on a GPU-less host; Press falls back to
    # libx264 software encoding automatically.
    devices:
      - /dev/dri:/dev/dri
    # NVIDIA GPU — uncomment if you have an NVIDIA card and the NVIDIA Container Toolkit installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
    networks:
      - jellyjar

volumes:
  jellyjar-output:
  jellyjar-config:

networks:
  jellyjar:
    driver: bridge
